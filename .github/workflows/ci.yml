name: CI - Testes e Validação Científica dos Estudos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Pytest & Reprodutibilidade dos Estudos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências Científicas
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy pandas scikit-learn statsmodels matplotlib pydantic

      - name: Executar Bateria de Testes dos Estudos (33 Testes)
        run: |
          python -m pytest codigo -v --durations=10
