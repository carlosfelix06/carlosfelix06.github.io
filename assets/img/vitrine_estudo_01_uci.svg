<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" width="380" height="460" role="img" aria-labelledby="t01 d01">
  <title id="t01">Estudo 01 — Qualidade dos Dados no Risco de Inadimplência</title>
  <desc id="d01">Experimento controlado sobre ausências em 30.000 contas UCI com queda de captura de cobrança de 32,3% para 27,4% e ROC-AUC estável.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0B2038"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid1" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="380" height="460" rx="12" fill="url(#bg1)"/>
  <rect width="380" height="460" rx="12" fill="url(#grid1)"/>

  <!-- Top Eyebrow -->
  <rect x="24" y="22" width="232" height="28" rx="14" fill="rgba(217,21,104,0.2)" stroke="rgba(244,114,182,0.5)" stroke-width="1"/>
  <text x="140" y="40" text-anchor="middle" fill="#F9A8D4" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">UCI DEFAULT · 30.000 CONTAS</text>

  <!-- Title -->
  <text x="24" y="80" fill="#F8FAFC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20.5" font-weight="800">Qualidade dos Dados</text>
  <text x="24" y="102" fill="#CBD5E1" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="500">Impacto em Cobrança &amp; Risco de Crédito</text>

  <!-- Panel 1: Gráfico de Queda na Captura Top 10% -->
  <rect x="24" y="118" width="332" height="154" rx="10" fill="rgba(15,23,42,0.78)" stroke="rgba(148,163,184,0.22)" stroke-width="1"/>
  <text x="38" y="142" fill="#93C5FD" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">CAPTURA NA FILA DE COBRANÇA (TOP 10%)</text>

  <!-- Bar 1: Base Completa -->
  <text x="38" y="174" fill="#F8FAFC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="700">Base Íntegra (Baseline)</text>
  <text x="342" y="174" text-anchor="end" fill="#34D399" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800">32,3% (436 contas)</text>
  <rect x="38" y="182" width="304" height="12" rx="6" fill="rgba(148,163,184,0.16)"/>
  <rect x="38" y="182" width="248" height="12" rx="6" fill="#10B981"/>

  <!-- Bar 2: Base com Falha DQ -->
  <text x="38" y="222" fill="#F8FAFC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="700">Base com Ruído DQ</text>
  <text x="342" y="222" text-anchor="end" fill="#F472B6" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800">27,4% (370 contas)</text>
  <rect x="38" y="230" width="304" height="12" rx="6" fill="rgba(148,163,184,0.16)"/>
  <rect x="38" y="230" width="210" height="12" rx="6" fill="#D91568"/>

  <text x="38" y="258" fill="#FCA5A5" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="600">Perda de 4,9 pp (-66 contas inadimplentes na esteira)</text>

  <!-- Two Crisp Metric Cards -->
  <rect x="24" y="286" width="158" height="148" rx="10" fill="rgba(30,41,59,0.75)" stroke="rgba(244,114,182,0.38)" stroke-width="1"/>
  <text x="38" y="312" fill="#F472B6" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">QUEDA CAPTURA</text>
  <text x="38" y="352" fill="#FFFFFF" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800">-4,9 pp</text>
  <text x="38" y="378" fill="#CBD5E1" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600">32,3% → 27,4%</text>
  <text x="38" y="408" fill="#94A3B8" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700">-66 inadimplentes</text>

  <rect x="198" y="286" width="158" height="148" rx="10" fill="rgba(14,116,144,0.28)" stroke="rgba(56,189,248,0.65)" stroke-width="1.4"/>
  <text x="212" y="312" fill="#7DD3FC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">ROC-AUC GLOBAL</text>
  <text x="212" y="352" fill="#FFFFFF" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800">-0,031</text>
  <text x="212" y="378" fill="#CBD5E1" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600">0,782 → 0,751</text>
  <text x="212" y="408" fill="#38BDF8" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700">Ilusão de estabilidade</text>
</svg>