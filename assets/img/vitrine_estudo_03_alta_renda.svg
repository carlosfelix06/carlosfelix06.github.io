<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" width="380" height="460" role="img" aria-labelledby="t03 d03">
  <title id="t03">Estudo 03 — Nichos de Valor, Renda e Risco no Crédito PF (IBGE &amp; BCB)</title>
  <desc id="d03">Clusterização de 138 bancos com dispersão de juros de 15,57x (Spearman rho = 0,866) e painel de 108 UF-anos (R² = 0,550).</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0B2038"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <pattern id="grid3" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="380" height="460" rx="12" fill="url(#bg3)"/>
  <rect width="380" height="460" rx="12" fill="url(#grid3)"/>

  <!-- Top Eyebrow -->
  <rect x="24" y="22" width="248" height="28" rx="14" fill="rgba(16,185,129,0.18)" stroke="rgba(52,211,153,0.5)" stroke-width="1"/>
  <text x="148" y="40" text-anchor="middle" fill="#6EE7B7" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">IBGE PNAD · 138 BANCOS · 108 UF-ANOS</text>

  <!-- Title -->
  <text x="24" y="80" fill="#F8FAFC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20.5" font-weight="800">Crédito PF &amp; Alta Renda</text>
  <text x="24" y="102" fill="#CBD5E1" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="500">Dispersão de Juros &amp; Limites da Renda</text>

  <!-- Panel 1: Gráfico de Dispersão de Juros P90/P10 -->
  <rect x="24" y="118" width="332" height="154" rx="10" fill="rgba(15,23,42,0.78)" stroke="rgba(148,163,184,0.22)" stroke-width="1"/>
  <text x="38" y="140" fill="#34D399" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">DISPERSÃO DE JUROS (P90 / P10 ENTRE BANCOS)</text>

  <!-- Linha 1: Não-Consignado -->
  <text x="38" y="166" fill="#F8FAFC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700">Pessoal Não-Consignado</text>
  <text x="342" y="166" text-anchor="end" fill="#F472B6" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="800">15,6x (385% a.a.)</text>
  <rect x="38" y="173" width="304" height="10" rx="5" fill="rgba(148,163,184,0.16)"/>
  <rect x="38" y="173" width="280" height="10" rx="5" fill="#D91568"/>

  <!-- Linha 2: Veículos -->
  <text x="38" y="202" fill="#F8FAFC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700">Aquisição de Veículos</text>
  <text x="342" y="202" text-anchor="end" fill="#38BDF8" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="800">2,6x (48% a.a.)</text>
  <rect x="38" y="209" width="304" height="10" rx="5" fill="rgba(148,163,184,0.16)"/>
  <rect x="38" y="209" width="130" height="10" rx="5" fill="#38BDF8"/>

  <!-- Linha 3: Consignado INSS -->
  <text x="38" y="238" fill="#F8FAFC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700">Consignado INSS (Teto)</text>
  <text x="342" y="238" text-anchor="end" fill="#34D399" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="800">1,3x (24% a.a.)</text>
  <rect x="38" y="245" width="304" height="10" rx="5" fill="rgba(148,163,184,0.16)"/>
  <rect x="38" y="245" width="65" height="10" rx="5" fill="#10B981"/>

  <text x="38" y="266" fill="#94A3B8" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9.5" font-weight="600">370 pares banco×produto: 80–83% permanecem no mesmo quartil (11m)</text>

  <!-- Two Crisp Metric Cards -->
  <rect x="24" y="286" width="158" height="148" rx="10" fill="rgba(30,41,59,0.75)" stroke="rgba(244,114,182,0.38)" stroke-width="1"/>
  <text x="38" y="312" fill="#F472B6" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">SPREAD NÃO-CONSIG.</text>
  <text x="38" y="352" fill="#FFFFFF" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800">15,57x</text>
  <text x="38" y="378" fill="#CBD5E1" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600">P90 vs P10 (81 inst.)</text>
  <text x="38" y="408" fill="#F472B6" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700">Persistência ρ = 0,866</text>

  <rect x="198" y="286" width="158" height="148" rx="10" fill="rgba(14,116,144,0.28)" stroke="rgba(52,211,153,0.65)" stroke-width="1.4"/>
  <text x="212" y="312" fill="#34D399" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">PAINEL 108 UF-ANOS</text>
  <text x="212" y="352" fill="#FFFFFF" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800">R² 0,55</text>
  <text x="212" y="378" fill="#CBD5E1" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600">Efeitos Fixos Temporais</text>
  <text x="212" y="408" fill="#34D399" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700">Renda isolada erra OOS</text>
</svg>