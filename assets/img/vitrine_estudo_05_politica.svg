  <text x="86" y="211" text-anchor="middle" fill="#6EE7B7" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="800">A · 0,52%</text>
  <text x="86" y="224" text-anchor="middle" fill="#A7F3D0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9">N = 2.670</text>

  <rect x="142" y="195" width="96" height="36" rx="5" fill="rgba(245,158,11,0.25)" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="190" y="211" text-anchor="middle" fill="#FDE68A" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="800">B · 2,30%</text>
  <text x="190" y="224" text-anchor="middle" fill="#FCD34D" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9">N = 3.343</text>

  <rect x="246" y="195" width="96" height="36" rx="5" fill="rgba(147,51,234,0.28)" stroke="#C084FC" stroke-width="1.2"/>
  <text x="294" y="211" text-anchor="middle" fill="#E9D5FF" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="800">C · 9,34%</text>
  <text x="294" y="224" text-anchor="middle" fill="#D8B4FE" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9">N = 2.945</text>

  <!-- Linha 0: Baixo LP -->
  <rect x="38" y="237" width="96" height="36" rx="5" fill="rgba(245,158,11,0.25)" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="86" y="253" text-anchor="middle" fill="#FDE68A" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="800">B · 1,85%</text>
  <text x="86" y="266" text-anchor="middle" fill="#FCD34D" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9">N = 1.678</text>

  <rect x="142" y="237" width="96" height="36" rx="5" fill="rgba(147,51,234,0.28)" stroke="#C084FC" stroke-width="1.2"/>
  <text x="190" y="253" text-anchor="middle" fill="#E9D5FF" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="800">C · 2,24%</text>
  <text x="190" y="266" text-anchor="middle" fill="#D8B4FE" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9">N = 2.943</text>

  <rect x="246" y="237" width="96" height="36" rx="5" fill="rgba(225,29,72,0.34)" stroke="#FB7185" stroke-width="1.2"/>
  <text x="294" y="253" text-anchor="middle" fill="#FFE4E6" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="800">C · 11,88%</text>
  <text x="294" y="266" text-anchor="middle" fill="#FECDD3" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9">N = 4.283</text>

  <!-- Cards inferiores -->
  <rect x="24" y="298" width="158" height="138" rx="10" fill="rgba(30,41,59,0.75)" stroke="rgba(244,114,182,0.38)" stroke-width="1"/>
  <text x="38" y="324" fill="#F472B6" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">RÍGIDA / RF 1D</text>
  <text x="38" y="365" fill="#FFFFFF" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="29" font-weight="800">4,55M</text>
  <text x="38" y="390" fill="#CBD5E1" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600">Rígida (117,3M EAD)</text>
  <text x="38" y="416" fill="#94A3B8" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.2" font-weight="700">RF 1D @ 122M: 4,71M</text>

  <rect x="198" y="298" width="158" height="138" rx="10" fill="rgba(6,95,70,0.34)" stroke="rgba(52,211,153,0.72)" stroke-width="1.4"/>
  <text x="212" y="324" fill="#6EE7B7" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">OTIMIZADA 2D</text>
  <text x="212" y="365" fill="#FFFFFF" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="29" font-weight="800">5,05M</text>
  <text x="212" y="390" fill="#A7F3D0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="600">EAD 121,98M · RF pareado 5,08M</text>
  <text x="212" y="416" fill="#34D399" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="800">EAD 117,32M: 2D 4,62M · RF 4,59M</text>
</svg>