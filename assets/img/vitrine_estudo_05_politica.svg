<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" width="380" height="460" role="img" aria-labelledby="t05 d05">
  <title id="t05">Estudo 05 — Funil R1-R4 e Matriz 3x3 Score LP vs Random Forest CP</title>
  <desc id="d05">No teste OOS, a política 2D gera P&amp;L simulado de 5,05M u.m. sobre EAD de 121,98M, contra 5,08M do RF 1D pareado no mesmo EAD. Em outro comparativo de capital igual (117,32M), o Score 2D contínuo gera 4,62M contra 4,59M do RF 1D.</desc>
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#0B2038"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="grid5" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="380" height="460" rx="12" fill="url(#bg5)"/>
  <rect width="380" height="460" rx="12" fill="url(#grid5)"/>

  <rect x="24" y="22" width="286" height="28" rx="14" fill="rgba(16,185,129,0.16)" stroke="rgba(52,211,153,0.48)" stroke-width="1"/>
  <text x="167" y="40" text-anchor="middle" fill="#6EE7B7" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">OPENML 46929 · FUNIL R1→R4 + MATRIZ 3×3</text>

  <text x="24" y="80" fill="#F8FAFC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="800">Política de Crédito 2D</text>
  <text x="24" y="102" fill="#94A3B8" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500">Score LP × Random Forest CP (150k históricos)</text>

  <!-- Mini Matriz 3x3 Visual -->
  <rect x="24" y="122" width="332" height="160" rx="10" fill="rgba(15,23,42,0.78)" stroke="rgba(148,163,184,0.20)" stroke-width="1"/>
  <text x="38" y="143" fill="#CBD5E1" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700">MATRIZ R4 (N = 26.868) · BAD RATE POR CÉLULA</text>

  <!-- Linha 2: Alto LP -->
  <rect x="38" y="153" width="96" height="36" rx="5" fill="rgba(16,185,129,0.28)" stroke="#34D399" stroke-width="1.2"/>
  <text x="86" y="169" text-anchor="middle" fill="#6EE7B7" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="800">A · 0,47%</text>
  <text x="86" y="182" text-anchor="middle" fill="#A7F3D0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9">N = 4.505</text>

  <rect x="142" y="153" width="96" height="36" rx="5" fill="rgba(245,158,11,0.25)" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="190" y="169" text-anchor="middle" fill="#FDE68A" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="800">B · 1,33%</text>
  <text x="190" y="182" text-anchor="middle" fill="#FCD34D" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9">N = 2.707</text>

  <rect x="246" y="153" width="96" height="36" rx="5" fill="rgba(217,21,104,0.38)" stroke="#F472B6" stroke-width="2.0"/>
  <text x="294" y="169" text-anchor="middle" fill="#FBCFE8" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="800">EW C · 6,35%</text>
  <text x="294" y="182" text-anchor="middle" fill="#F9A8D4" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9">N = 1.794 (13,6×)</text>

