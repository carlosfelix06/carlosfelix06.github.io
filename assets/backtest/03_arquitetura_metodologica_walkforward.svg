<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#FFFFFF; border-radius:10px;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2038" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D91568" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.05" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94A3B8" />
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D91568" />
    </marker>
  </defs>

  <!-- Banner Superior -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#headerGrad)" rx="10" />
  <rect x="0" y="66" width="1200" height="4" fill="url(#accentGrad)" />
  
  <text x="30" y="34" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="0.5">ARQUITETURA METODOLÓGICA · PIPELINE WALK-FORWARD DE PROJEÇÃO DE CRÉDITO PF</text>
  <text x="30" y="54" fill="#94A3B8" font-size="13">De 57 meses BCB ao MAE de previsão: R$ 13,63 bi → R$ 6,24 bi/mês (diferença, não caixa economizado)</text>
  
  <rect x="980" y="20" width="190" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <circle cx="998" cy="35" r="5" fill="#10B981" />
  <text x="1012" y="39" fill="#F8FAFC" font-size="11.5" font-weight="700">BCB SGS DADOS REAIS</text>

  <!-- COLUNA 1: Ingestão & Carteiras -->
  <g transform="translate(30, 95)" filter="url(#cardShadow)">
    <rect width="255" height="395" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect width="255" height="36" rx="8" fill="#F8FAFC" />
    <path d="M 0 36 L 255 36" stroke="#E2E8F0" stroke-width="1" />
    <rect x="0" y="0" width="5" height="395" fill="#D91568" rx="2" />
    
    <text x="18" y="23" fill="#0B2038" font-size="13" font-weight="800">1. INGESTÃO BCB SGS</text>
    <text x="18" y="56" fill="#64748B" font-size="11" font-weight="600">5 Modalidades PF · R$ 356,3 bi/mês</text>
    
    <!-- Cartão -->
    <text x="18" y="82" fill="#0B2038" font-size="12" font-weight="700">Cartão de Crédito Total</text>
    <text x="235" y="82" fill="#D91568" font-size="12" font-weight="800" text-anchor="end">71,0%</text>
    <rect x="18" y="89" width="218" height="6" rx="3" fill="#F1F5F9" />
    <rect x="18" y="89" width="155" height="6" rx="3" fill="#D91568" />

    <!-- Não Consignado -->
    <text x="18" y="117" fill="#0B2038" font-size="12" font-weight="700">Pessoal Não-Consignado</text>
    <text x="235" y="117" fill="#2563EB" font-size="12" font-weight="800" text-anchor="end">5,8%</text>
    <rect x="18" y="124" width="218" height="6" rx="3" fill="#F1F5F9" />
    <rect x="18" y="124" width="13" height="6" rx="3" fill="#2563EB" />

    <!-- Consignado -->
    <text x="18" y="152" fill="#0B2038" font-size="12" font-weight="700">Pessoal Consignado</text>
    <text x="235" y="152" fill="#F59E0B" font-size="12" font-weight="800" text-anchor="end">5,4%</text>
    <rect x="18" y="159" width="218" height="6" rx="3" fill="#F1F5F9" />
    <rect x="18" y="159" width="12" height="6" rx="3" fill="#F59E0B" />

    <!-- Veículos -->
    <text x="18" y="187" fill="#0B2038" font-size="12" font-weight="700">Aquisição de Veículos</text>
    <text x="235" y="187" fill="#8B5CF6" font-size="12" font-weight="800" text-anchor="end">5,3%</text>
    <rect x="18" y="194" width="218" height="6" rx="3" fill="#F1F5F9" />
    <rect x="18" y="194" width="12" height="6" rx="3" fill="#8B5CF6" />

    <!-- Cheque -->
    <text x="18" y="222" fill="#0B2038" font-size="12" font-weight="700">Cheque Especial PF</text>
    <text x="235" y="222" fill="#64748B" font-size="12" font-weight="800" text-anchor="end">12,5%</text>
    <rect x="18" y="229" width="218" height="6" rx="3" fill="#F1F5F9" />
    <rect x="18" y="229" width="27" height="6" rx="3" fill="#64748B" />

    <!-- Alerta Metodológico -->
    <rect x="15" y="255" width="225" height="125" rx="6" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
    <text x="24" y="275" fill="#9F1239" font-size="11" font-weight="800">ALERTA METODOLÓGICO:</text>
    <text x="24" y="293" fill="#4C0519" font-size="11">O MAPE não-ponderado trata</text>
    <text x="24" y="309" fill="#4C0519" font-size="11">nichos voláteis (3,5%) com o</text>
    <text x="24" y="325" fill="#4C0519" font-size="11">mesmo peso do Cartão (71%).</text>
    <text x="24" y="347" fill="#9F1239" font-size="11" font-weight="800">→ Solução Adotada:</text>
    <text x="24" y="363" fill="#4C0519" font-size="11">wMAPE ponderado por volume R$.</text>
  </g>

  <!-- Seta 1 -> 2 -->
  <line x1="290" y1="292" x2="318" y2="292" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- COLUNA 2: Calendário & Features -->
  <g transform="translate(325, 95)" filter="url(#cardShadow)">
    <rect width="255" height="395" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect width="255" height="36" rx="8" fill="#F8FAFC" />
    <path d="M 0 36 L 255 36" stroke="#E2E8F0" stroke-width="1" />
    <rect x="0" y="0" width="5" height="395" fill="#2563EB" rx="2" />
    
    <text x="18" y="23" fill="#0B2038" font-size="13" font-weight="800">2. CALENDÁRIO &amp; FEATURES</text>
    <text x="18" y="56" fill="#64748B" font-size="11" font-weight="600">Engenharia de Recursos Reais</text>

    <!-- Item A: Dias Úteis -->
    <rect x="15" y="72" width="225" height="65" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="25" y="92" fill="#1E40AF" font-size="12" font-weight="800">Dias Úteis Reais (BR)</text>
    <text x="25" y="109" fill="#1E3A8A" font-size="11">numpy.busdaycalendar com</text>
    <text x="25" y="124" fill="#1E3A8A" font-size="11">feriados nacionais da ANBIMA</text>

    <!-- Item B: Fourier -->
    <rect x="15" y="146" width="225" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="25" y="166" fill="#0B2038" font-size="12" font-weight="800">Harmônicos Anuais (Fourier)</text>
    <text x="25" y="183" fill="#475569" font-size="11">sen e cos(2πm/12) capturam</text>
    <text x="25" y="198" fill="#475569" font-size="11">a ciclicidade suave anual</text>

    <!-- Item C: Dummies -->
    <rect x="15" y="220" width="225" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="25" y="240" fill="#0B2038" font-size="12" font-weight="800">Dummies Sazonais Extremas</text>
    <text x="25" y="257" fill="#475569" font-size="11">Dezembro (pico 13º salário)</text>
    <text x="25" y="272" fill="#475569" font-size="11">Jan/Fev (ressaca e carnaval)</text>

    <!-- Item D: Auto-regressão -->
    <rect x="15" y="294" width="225" height="86" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="25" y="314" fill="#0B2038" font-size="12" font-weight="800">Componente Autoregressivo</text>
    <text x="25" y="331" fill="#475569" font-size="11">log(y_{t-1}) · nível do mês anterior</text>
    <text x="25" y="347" fill="#475569" font-size="11">log(y_{t-12}) · âncora do ano anterior</text>
    <text x="25" y="365" fill="#2563EB" font-size="11" font-weight="700">Modelo: Ridge com regularização L2</text>
  </g>

  <!-- Seta 2 -> 3 -->
  <line x1="585" y1="292" x2="613" y2="292" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- COLUNA 3: Walk-Forward & Modelos -->
  <g transform="translate(620, 95)" filter="url(#cardShadow)">
    <rect width="255" height="395" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect width="255" height="36" rx="8" fill="#F8FAFC" />
    <path d="M 0 36 L 255 36" stroke="#E2E8F0" stroke-width="1" />
    <rect x="0" y="0" width="5" height="395" fill="#6A1B9A" rx="2" />
    
    <text x="18" y="23" fill="#0B2038" font-size="13" font-weight="800">3. WALK-FORWARD OOS</text>
    <text x="18" y="56" fill="#64748B" font-size="11" font-weight="600">33 Origens Out-of-Sample (01/24–09/26)</text>

    <!-- Janela Expansiva -->
    <rect x="15" y="72" width="225" height="52" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" />
    <text x="24" y="90" fill="#581C87" font-size="11" font-weight="800">JANELA EXPANSIVA (Point-in-Time):</text>
    <text x="24" y="105" fill="#6B21A8" font-size="10.5">Treino até t-1 (mínimo de 24 meses)</text>
    <text x="24" y="118" fill="#6B21A8" font-size="10.5">Teste estritamente em t (sem vazamento)</text>

    <text x="18" y="145" fill="#0B2038" font-size="11.5" font-weight="800">4 FAMÍLIAS COMPETITIVAS:</text>

    <!-- Mod 1 -->
    <rect x="15" y="154" width="225" height="42" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="24" y="171" fill="#64748B" font-size="11" font-weight="700">1. Ingênuo (t-1)</text>
    <text x="24" y="186" fill="#475569" font-size="10">wMAPE: 4,52% · MAE: R$ 13,63 bi/mês</text>

    <!-- Mod 2 -->
    <rect x="15" y="202" width="225" height="42" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="24" y="219" fill="#64748B" font-size="11" font-weight="700">2. Sazonal Ingênuo (t-12)</text>
    <text x="24" y="234" fill="#475569" font-size="10">wMAPE: 11,01% · Erro: R$ 38,02 bi/mês</text>

    <!-- Mod 3 -->
    <rect x="15" y="250" width="225" height="42" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="24" y="267" fill="#64748B" font-size="11" font-weight="700">3. Holt-Winters Aditivo (ETS)</text>
    <text x="24" y="282" fill="#475569" font-size="10">wMAPE: 4,50% · MAE: R$ 12,04 bi/mês</text>

    <!-- Mod 4 (Campeão) -->
    <rect x="15" y="298" width="225" height="82" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
    <rect x="15" y="298" width="225" height="20" rx="6" fill="#DCFCE7" />
    <text x="24" y="312" fill="#166534" font-size="10.5" font-weight="800">★ 4. RIDGE + CALENDÁRIO BANCÁRIO</text>
    <text x="24" y="333" fill="#15803D" font-size="11" font-weight="800">wMAPE: 2,79% (-38%)</text>
    <text x="24" y="349" fill="#166534" font-size="10.5">Bottom-Up MAE: R$ 6,24 bi/mês</text>
    <text x="24" y="365" fill="#166534" font-size="10.5">Ljung-Box p = 0,4026</text>
  </g>

  <!-- Seta 3 -> 4 -->
  <line x1="880" y1="292" x2="908" y2="292" stroke="#D91568" stroke-width="2.5" marker-end="url(#arrowPink)" />

  <!-- COLUNA 4: Decisão & Impacto -->
  <g transform="translate(915, 95)" filter="url(#cardShadow)">
    <rect width="255" height="395" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect width="255" height="36" rx="8" fill="#F8FAFC" />
    <path d="M 0 36 L 255 36" stroke="#E2E8F0" stroke-width="1" />
    <rect x="0" y="0" width="5" height="395" fill="#10B981" rx="2" />
    
    <text x="18" y="23" fill="#0B2038" font-size="13" font-weight="800">4. DECISÃO &amp; IMPACTO</text>
    <text x="18" y="56" fill="#64748B" font-size="11" font-weight="600">Precisão de previsão · sem caixa realizado</text>

    <!-- KPI 1: Redução do MAE -->
    <rect x="15" y="72" width="225" height="75" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
    <text x="24" y="92" fill="#166534" font-size="11" font-weight="800">REDUÇÃO DO MAE DE PREVISÃO:</text>
    <text x="24" y="119" fill="#15803D" font-size="20" font-weight="900">R$ 7,39 bi/mês</text>
    <text x="24" y="137" fill="#166534" font-size="10.5">R$ 13,63 bi → R$ 6,24 bi (DM p=0,0156)</text>

    <!-- KPI 2: Meta +/- 5% -->
    <rect x="15" y="156" width="225" height="70" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="24" y="176" fill="#1E40AF" font-size="11" font-weight="800">ADERÊNCIA À META ±5%:</text>
    <text x="24" y="202" fill="#1D4ED8" font-size="20" font-weight="900">97,0% dos meses</text>
    <text x="24" y="218" fill="#1E40AF" font-size="10.5">32 de 33 meses (vs 75,8% no Ingênuo)</text>

    <!-- KPI 3: Ljung-Box -->
    <rect x="15" y="235" width="225" height="64" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="24" y="255" fill="#0B2038" font-size="11" font-weight="800">DIAGNÓSTICO DE RESÍDUOS:</text>
    <text x="24" y="274" fill="#0B2038" font-size="14" font-weight="800">Ljung-Box p = 0,4026</text>
    <text x="24" y="291" fill="#64748B" font-size="10.5">Sem evidência de autocorrelação residual</text>

    <!-- Regra de Gestão -->
    <rect x="15" y="308" width="225" height="72" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" />
    <text x="24" y="327" fill="#581C87" font-size="10.5" font-weight="800">REGRA DE GESTÃO:</text>
    <text x="24" y="344" fill="#6B21A8" font-size="10.5">Separar metas: Cartão opera a 2,29%,</text>
    <text x="24" y="359" fill="#6B21A8" font-size="10.5">Consignado exige piso de 8,91% (INSS).</text>
    <text x="24" y="374" fill="#6B21A8" font-size="10.5">Agregação: Bottom-Up supera Direta.</text>
  </g>
</svg>